[project]
name = "mcp-server-template"
version = "0.1.0"
description = "Plantilla de MCP Server enterprise (FastMCP + SSO) y MCP de prueba Boostr KYC"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.10",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
gcp = ["google-cloud-firestore>=2.16"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_core", "src/boostr_kyc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
